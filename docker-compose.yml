# Development lokal: backend + frontend. Jalankan: docker compose up --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: iec61850_backend_simulator
    ports:
      - "6061:6061"   # HTTP API + Socket.IO
      - "102:102"     # MMS IED ke-1 (IEC 61850)
      - "10102-10200:10102-10200"   # MMS IED ke-2 dst (MMS_PORT_BASE + n - 2), cukup untuk 100 IED
    env_file:
      - path: ./backend/.env   # opsional, salin dari backend/.env.example
        required: false
    environment:
      - HTTP_PORT=6061
      - MMS_PORT=102
      - MMS_PORT_BASE=10102

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: iec61850_frontend_simulator
    ports:
      - "4061:4061"
    depends_on:
      - backend
